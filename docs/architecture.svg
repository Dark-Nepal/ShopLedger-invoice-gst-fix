<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger modules and six numbered order placement steps. Invoice module is highlighted as the ticket focus.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.sub{font-size:13px;fill:#475569}
      .head{font-size:16px;font-weight:700}.label{font-size:13px}.small{font-size:12px;fill:#475569}
      .node{fill:#fff;stroke:#94a3b8;stroke-width:1.4}.shell{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}
      .router{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.4}.lib{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
      .focus{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.db{fill:#ecfdf5;stroke:#34a47a;stroke-width:1.5}
      .line{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#blueArrow)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="64" class="sub">Node / Express POS, Khata ledger and GST invoicing · solid blue arrows mark order placement</text>

  <!-- Browser and server -->
  <rect x="32" y="92" width="240" height="94" rx="10" class="shell"/>
  <text x="50" y="119" class="head">Browser UI</text>
  <text x="50" y="142" class="label">public/index.html</text>
  <text x="50" y="162" class="label">public/js/app.js · public/css/style.css</text>
  <rect x="365" y="92" width="260" height="94" rx="10" class="shell"/>
  <text x="385" y="119" class="head">server.js · Express</text>
  <text x="385" y="142" class="label">static public/ · mounts /api routes</text>
  <text x="385" y="162" class="label">GET /orders/:id/invoice → invoice.render()</text>
  <rect x="895" y="92" width="270" height="94" rx="10" class="node"/>
  <text x="915" y="119" class="head">config.js</text>
  <text x="915" y="142" class="label">shop settings · HSN GST slabs</text>
  <text x="915" y="162" class="label">coupon rules · port · admin key</text>
  <path d="M272 139 H365" class="flow"/><text x="285" y="129" class="small">HTTP</text>
  <path d="M625 139 H895" class="dash"/><text x="700" y="129" class="small">configuration</text>

  <!-- Routers -->
  <text x="32" y="224" class="head">routes/ · mounted at /api</text>
  <rect x="32" y="240" width="255" height="72" rx="8" class="router"/>
  <text x="48" y="266" class="head">products.js</text><text x="48" y="289" class="label">GET /products · GET /coupons</text>
  <rect x="318" y="240" width="255" height="72" rx="8" class="router"/>
  <text x="334" y="266" class="head">orders.js</text><text x="334" y="289" class="label">POST /orders · cancel · history</text>
  <rect x="604" y="240" width="255" height="72" rx="8" class="router"/>
  <text x="620" y="266" class="head">customers.js</text><text x="620" y="289" class="label">GET /customers · settle Khata</text>
  <rect x="890" y="240" width="275" height="72" rx="8" class="router"/>
  <text x="906" y="266" class="head">reports.js</text><text x="906" y="289" class="label">preview pricing · reports · export</text>
  <path d="M495 186 V215 H445 V240" class="flow"/>

  <!-- flow numbers along the active order pathway -->
  <circle cx="301" cy="219" r="13" class="num"/><text x="301" y="223" class="numtext">1</text>
  <circle cx="590" cy="219" r="13" class="num"/><text x="590" y="223" class="numtext">2</text>
  <circle cx="301" cy="362" r="13" class="num"/><text x="301" y="366" class="numtext">3</text>
  <circle cx="590" cy="362" r="13" class="num"/><text x="590" y="366" class="numtext">4</text>
  <circle cx="878" cy="362" r="13" class="num"/><text x="878" y="366" class="numtext">5</text>
  <circle cx="590" cy="656" r="13" class="num"/><text x="590" y="660" class="numtext">6</text>

  <!-- Libraries -->
  <text x="32" y="352" class="head">lib/ · business logic</text>
  <rect x="32" y="378" width="170" height="57" rx="7" class="lib"/><text x="47" y="402" class="head">inventory.js</text><text x="47" y="422" class="small">find · check · reserve</text>
  <rect x="220" y="378" width="170" height="57" rx="7" class="lib"/><text x="235" y="402" class="head">pricing.js</text><text x="235" y="422" class="small">subtotal · computeTotals</text>
  <rect x="408" y="378" width="170" height="57" rx="7" class="lib"/><text x="423" y="402" class="head">coupons.js</text><text x="423" y="422" class="small">validate · calculateDiscount</text>
  <rect x="596" y="378" width="170" height="57" rx="7" class="lib"/><text x="611" y="402" class="head">orders.js</text><text x="611" y="422" class="small">add · get · cancel · list</text>
  <rect x="784" y="378" width="170" height="57" rx="7" class="lib"/><text x="799" y="402" class="head">ledger.js</text><text x="799" y="422" class="small">Khata · settlements</text>
  <rect x="972" y="378" width="193" height="57" rx="7" class="focus"/><text x="987" y="402" class="head">invoice.js</text><text x="987" y="422" class="small">computeInvoiceFigures · render</text>

  <rect x="32" y="456" width="170" height="57" rx="7" class="lib"/><text x="47" y="480" class="head">tax.js</text><text x="47" y="500" class="small">HSN rate · CGST / SGST</text>
  <rect x="220" y="456" width="170" height="57" rx="7" class="lib"/><text x="235" y="480" class="head">store.js</text><text x="235" y="500" class="small">read · write · audit</text>
  <rect x="408" y="456" width="170" height="57" rx="7" class="lib"/><text x="423" y="480" class="head">reports.js</text><text x="423" y="500" class="small">dashboard · reconciliation</text>
  <rect x="596" y="456" width="170" height="57" rx="7" class="lib"/><text x="611" y="480" class="head">dates.js</text><text x="611" y="500" class="small">today · date keys · FY</text>

  <!-- order flow connectors -->
  <path d="M445 312 V350 H117 V378" class="flow"/>
  <path d="M287 406 H220" class="flow"/>
  <path d="M390 406 H408" class="flow"/>
  <path d="M573 276 H670 V378" class="flow"/>
  <path d="M670 435 V456" class="flow"/>
  <path d="M766 406 H784" class="flow"/>
  <path d="M670 435 V540 H305 V513" class="flow"/>
  <path d="M305 513 V568 H470 V612" class="flow"/>
  <path d="M953 406 H972" class="dash"/>
  <path d="M1068 186 V378" class="dash"/>
  <path d="M117 435 V456" class="line"/>
  <path d="M493 312 V378" class="dash"/>
  <path d="M493 435 V456" class="dash"/>

  <!-- numbered description and persistence -->
  <rect x="32" y="548" width="500" height="157" rx="10" class="shell"/>
  <text x="50" y="575" class="head">Order placement · POST /api/orders</text>
  <text x="50" y="601" class="label"><tspan font-weight="700">1</tspan><tspan> Browser submits cart and checkout details.</tspan></text>
  <text x="50" y="624" class="label"><tspan font-weight="700">2</tspan><tspan> routes/orders.js reads data and resolves products.</tspan></text>
  <text x="50" y="647" class="label"><tspan font-weight="700">3</tspan><tspan> inventory checks sellable stock; pricing computes totals.</tspan></text>
  <text x="50" y="670" class="label"><tspan font-weight="700">4</tspan><tspan> coupons validates; tax resolves GST; ledger charges Khata if selected.</tspan></text>
  <text x="50" y="693" class="label"><tspan font-weight="700">5–6</tspan><tspan> reserve stock, orders.add, appendAudit, then store.write.</tspan></text>

  <path d="M202 406 H305 V548" class="flow"/>
  <path d="M305 513 V548" class="flow"/>
  <path d="M305 548 V530 H875 V612" class="flow"/>
  <rect x="605" y="612" width="560" height="82" rx="10" class="db"/>
  <text x="625" y="640" class="head">data/db.json</text>
  <text x="625" y="663" class="label">products · customers · orders · settlements · auditLog</text>
  <text x="625" y="682" class="small">store.write(db) persists checkout updates</text>
  <path d="M390 484 H555 V653 H605" class="line"/>

  <!-- legend -->
  <rect x="887" y="548" width="278" height="48" rx="8" class="focus"/>
  <text x="903" y="578" class="label" font-weight="700">Ticket focus: lib/invoice.js</text>
  <line x1="903" y1="720" x2="947" y2="720" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <text x="958" y="724" class="small">Order placement flow</text>
  <line x1="903" y1="744" x2="947" y2="744" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="958" y="748" class="small">Module dependency / data access</text>
</svg>
